<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
  <rect width="1500" height="540" fill="#ffffff"/>
  <text x="750" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Performance Change by Number of Generated Anomaly Windows</text>

  <style>
    .axis { stroke: #374151; stroke-width: 1.4; }
    .grid { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; }
    .tick { font-family: Arial, sans-serif; font-size: 12px; fill: #4b5563; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <!-- F1 panel -->
  <g transform="translate(70,75)">
    <text x="185" y="0" text-anchor="middle" class="title">F1 Score</text>
    <line x1="0" y1="300" x2="360" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="360" y2="0" class="grid"/>
    <line x1="0" y1="60" x2="360" y2="60" class="grid"/>
    <line x1="0" y1="120" x2="360" y2="120" class="grid"/>
    <line x1="0" y1="180" x2="360" y2="180" class="grid"/>
    <line x1="0" y1="240" x2="360" y2="240" class="grid"/>
    <text x="-12" y="304" text-anchor="end" class="tick">0.50</text>
    <text x="-12" y="244" text-anchor="end" class="tick">0.60</text>
    <text x="-12" y="184" text-anchor="end" class="tick">0.70</text>
    <text x="-12" y="124" text-anchor="end" class="tick">0.80</text>
    <text x="-12" y="64" text-anchor="end" class="tick">0.90</text>
    <text x="-12" y="4" text-anchor="end" class="tick">1.00</text>
    <text x="0" y="326" text-anchor="middle" class="tick">50</text>
    <text x="80" y="326" text-anchor="middle" class="tick">100</text>
    <text x="160" y="326" text-anchor="middle" class="tick">200</text>
    <text x="240" y="326" text-anchor="middle" class="tick">500</text>
    <text x="320" y="326" text-anchor="middle" class="tick">1000</text>
    <text x="180" y="356" text-anchor="middle" class="label">Generated anomaly count</text>
    <text x="-50" y="150" text-anchor="middle" transform="rotate(-90 -50 150)" class="label">Final test score</text>

    <polyline class="series" stroke="#7A7A7A" points="0,159 80,175 160,179 240,152 320,164"/>
    <polyline class="series" stroke="#2F80ED" points="0,192 80,198 160,181 240,161 320,131"/>
    <polyline class="series" stroke="#27AE60" points="0,169 80,157 160,137 240,118 320,111"/>
    <polyline class="series" stroke="#D35400" points="0,164 80,158 160,146 240,115 320,89"/>
  </g>

  <!-- Recall panel -->
  <g transform="translate(570,75)">
    <text x="185" y="0" text-anchor="middle" class="title">Recall</text>
    <line x1="0" y1="300" x2="360" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="360" y2="0" class="grid"/>
    <line x1="0" y1="60" x2="360" y2="60" class="grid"/>
    <line x1="0" y1="120" x2="360" y2="120" class="grid"/>
    <line x1="0" y1="180" x2="360" y2="180" class="grid"/>
    <line x1="0" y1="240" x2="360" y2="240" class="grid"/>
    <text x="-12" y="304" text-anchor="end" class="tick">0.50</text>
    <text x="-12" y="244" text-anchor="end" class="tick">0.60</text>
    <text x="-12" y="184" text-anchor="end" class="tick">0.70</text>
    <text x="-12" y="124" text-anchor="end" class="tick">0.80</text>
    <text x="-12" y="64" text-anchor="end" class="tick">0.90</text>
    <text x="-12" y="4" text-anchor="end" class="tick">1.00</text>
    <text x="0" y="326" text-anchor="middle" class="tick">50</text>
    <text x="80" y="326" text-anchor="middle" class="tick">100</text>
    <text x="160" y="326" text-anchor="middle" class="tick">200</text>
    <text x="240" y="326" text-anchor="middle" class="tick">500</text>
    <text x="320" y="326" text-anchor="middle" class="tick">1000</text>
    <text x="180" y="356" text-anchor="middle" class="label">Generated anomaly count</text>

    <polyline class="series" stroke="#7A7A7A" points="0,245 80,249 160,266 240,237 320,243"/>
    <polyline class="series" stroke="#2F80ED" points="0,288 80,278 160,268 240,221 320,160"/>
    <polyline class="series" stroke="#27AE60" points="0,253 80,217 160,199 240,166 320,170"/>
    <polyline class="series" stroke="#D35400" points="0,243 80,215 160,231 240,184 320,142"/>
  </g>

  <!-- AUPRC panel -->
  <g transform="translate(1070,75)">
    <text x="185" y="0" text-anchor="middle" class="title">AUPRC</text>
    <line x1="0" y1="300" x2="360" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="360" y2="0" class="grid"/>
    <line x1="0" y1="60" x2="360" y2="60" class="grid"/>
    <line x1="0" y1="120" x2="360" y2="120" class="grid"/>
    <line x1="0" y1="180" x2="360" y2="180" class="grid"/>
    <line x1="0" y1="240" x2="360" y2="240" class="grid"/>
    <text x="-12" y="304" text-anchor="end" class="tick">0.50</text>
    <text x="-12" y="244" text-anchor="end" class="tick">0.60</text>
    <text x="-12" y="184" text-anchor="end" class="tick">0.70</text>
    <text x="-12" y="124" text-anchor="end" class="tick">0.80</text>
    <text x="-12" y="64" text-anchor="end" class="tick">0.90</text>
    <text x="-12" y="4" text-anchor="end" class="tick">1.00</text>
    <text x="0" y="326" text-anchor="middle" class="tick">50</text>
    <text x="80" y="326" text-anchor="middle" class="tick">100</text>
    <text x="160" y="326" text-anchor="middle" class="tick">200</text>
    <text x="240" y="326" text-anchor="middle" class="tick">500</text>
    <text x="320" y="326" text-anchor="middle" class="tick">1000</text>
    <text x="180" y="356" text-anchor="middle" class="label">Generated anomaly count</text>

    <polyline class="series" stroke="#7A7A7A" points="0,97 80,107 160,101 240,88 320,79"/>
    <polyline class="series" stroke="#2F80ED" points="0,108 80,120 160,88 240,88 320,71"/>
    <polyline class="series" stroke="#27AE60" points="0,106 80,109 160,99 240,83 320,77"/>
    <polyline class="series" stroke="#D35400" points="0,105 80,99 160,83 240,52 320,37"/>
  </g>

  <!-- Legend -->
  <g transform="translate(405,485)" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#7A7A7A" stroke-width="3"/><text x="46" y="5">GT-GAN</text>
    <line x1="185" y1="0" x2="221" y2="0" stroke="#2F80ED" stroke-width="3"/><text x="231" y="5">Diffusion</text>
    <line x1="400" y1="0" x2="436" y2="0" stroke="#27AE60" stroke-width="3"/><text x="446" y="5">Masking GT-GAN</text>
    <line x1="675" y1="0" x2="711" y2="0" stroke="#D35400" stroke-width="3"/><text x="721" y="5">Masking Diffusion</text>
  </g>
</svg>
